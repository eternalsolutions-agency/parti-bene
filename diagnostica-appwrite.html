<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="styles.css">
<title>Diagnostica Appwrite | Parti Bene</title>
</head>
<body>
<main><section class="page-hero"><div class="container"><h1>Diagnostica collegamento</h1><p class="hero-copy">Questa pagina esegue solo controlli di lettura e non modifica dati o account.</p></div></section>
<section><div class="container" style="max-width:760px">
<div class="panel">
<button id="run" class="btn btn-primary" type="button">Avvia controllo</button>
<div id="results" style="display:grid;gap:12px;margin-top:22px"></div>
</div>
</div></section></main>
<script>
const endpoint="https://fra.cloud.appwrite.io/v1";
const project="6aa8e03b000fb4dd909e";
const results=document.getElementById("results");

function row(label,state,detail){
 const el=document.createElement("div");
 el.className="notice";
 el.style.background=state==="ok"?"#eef9f7":"#fff1ef";
 el.style.borderColor=state==="ok"?"#cfeae5":"#ffd1ca";
 el.style.color=state==="ok"?"#35695f":"#8f3327";
 el.innerHTML="<strong>"+label+": "+(state==="ok"?"OK":"ERRORE")+"</strong><br><span style='word-break:break-word'>"+detail+"</span>";
 results.appendChild(el);
}
async function check(label,url,options={}){
 try{
   const response=await fetch(url,options);
   const text=await response.text();
   row(label,response.ok||response.status===401?"ok":"error","HTTP "+response.status+" · "+text.slice(0,300));
 }catch(error){
   row(label,"error",error.name+" · "+error.message);
 }
}
document.getElementById("run").addEventListener("click",async()=>{
 results.innerHTML="";
 await check("Connessione FRA",endpoint+"/health/version");
 await check("Riconoscimento progetto",endpoint+"/account",{
   method:"GET",
   credentials:"include",
   headers:{"X-Appwrite-Project":project,"X-Appwrite-Response-Format":"1.8.0"}
 });
});
</script>
</body></html>
