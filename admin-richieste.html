<!doctype html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Richieste viaggio | Parti Bene</title><link rel="icon" href="logo-parti-bene.png"><link rel="stylesheet" href="styles.css"><style>
.match-layout{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}.request-list{display:grid;gap:9px;max-height:720px;overflow:auto}.request-button{border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:14px;background:#fff;padding:14px;text-align:left;cursor:pointer}.request-button strong{display:block;color:var(--navy)}.request-button span{font-size:12px;color:var(--muted)}.candidate{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.candidate-score{background:var(--orange-soft);color:var(--orange-dark);border-radius:999px;padding:6px 9px;font-weight:900;font-size:12px}@media(max-width:850px){.match-layout{grid-template-columns:1fr}}
</style><script src="effects.js" defer></script></head><body>
<div class="topbar">Gestione riservata delle richieste di viaggio</div><header><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="logo-parti-bene.png" alt="Parti Bene"></a><nav><a href="admin.html">Iscrizioni</a><a href="dashboard.html">Dashboard</a><a href="index.html">Sito pubblico</a></nav><div class="actions"><button id="reload" class="btn btn-ghost">Aggiorna</button><button id="logout" class="btn btn-primary">Esci</button></div></div></header>
<main><section class="page-hero"><div class="container"><div class="kicker">Amministrazione</div><h1>Richieste di viaggio</h1><p class="hero-copy">Abbina ogni richiesta a un massimo di tre professionisti compatibili.</p></div></section><section><div class="container"><div id="access" class="panel loading">Verifica accesso…</div><div id="app" class="match-layout" hidden><aside class="panel"><h3 style="margin-top:0">Richieste</h3><div id="list" class="request-list"></div></aside><div id="detail" class="panel">Seleziona una richiesta.</div></div></div></section></main>
<script type="module">
import {APPWRITE_CONFIG,account,ID,Permission,Role,readableError} from "./appwrite-config.js";
const headers={"Content-Type":"application/json","X-Appwrite-Project":APPWRITE_CONFIG.projectId,"X-Appwrite-Response-Format":"1.8.0"};
const api=async(path,{method="GET",body}={})=>{const response=await fetch(APPWRITE_CONFIG.endpoint+path,{method,credentials:"include",headers,body:body?JSON.stringify(body):undefined});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.message||"Operazione non riuscita.");return result;};
const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let requests=[],profiles=[],assignments=[],selected=null;
const base=id=>"/tablesdb/"+APPWRITE_CONFIG.databaseId+"/tables/"+id+"/rows";
function normalize(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function score(profile,request){let n=0,reasons=[];const hay=normalize([...(profile.destinazioni||[]),profile.descrizione].join(" ")),spec=normalize((profile.specializzazioni||[]).join(" ")),dest=normalize(request.destinazione),type=normalize(request.tipologia_viaggio);if(request.professionista_preferito===profile.slug){n+=100;reasons.push("professionista scelto");}if(dest&&hay.includes(dest)){n+=6;reasons.push("destinazione");}if(type&&spec.includes(type.split(" ")[0])){n+=4;reasons.push("specializzazione");}if(request.assistenza==="Online"&&profile.disponibile_online){n+=3;reasons.push("online");}if(request.assistenza==="Vicino a me"&&normalize(request.partenza_da).includes(normalize(profile.comune))){n+=3;reasons.push("vicinanza");}return {n,reasons:reasons.join(", ")||"profilo disponibile"};}
async function load(){const [r,p,a]=await Promise.all([api(base(APPWRITE_CONFIG.travelRequestsTableId)),api(base(APPWRITE_CONFIG.professionalsTableId)),api(base(APPWRITE_CONFIG.requestAssignmentsTableId))]);requests=(r.rows||[]).sort((x,y)=>new Date(y.$createdAt)-new Date(x.$createdAt));profiles=(p.rows||[]).filter(x=>x.stato==="pubblicato"&&x.utente_id);assignments=a.rows||[];renderList();if(selected){const row=requests.find(x=>x.$id===selected);if(row)renderDetail(row);}}
function renderList(){document.getElementById("list").innerHTML=requests.length?requests.map(r=>'<button class="request-button" data-id="'+r.$id+'"><strong>'+esc(r.destinazione)+'</strong><span>'+esc(r.nome_cliente)+' · '+esc(r.stato)+'</span></button>').join(""):'<p class="meta">Nessuna richiesta.</p>';}
function renderDetail(r){selected=r.$id;const ranked=profiles.map(p=>({p,...score(p,r)})).sort((a,b)=>b.n-a.n).slice(0,6),current=assignments.filter(a=>a.richiesta_id===r.$id);document.getElementById("detail").innerHTML='<div class="kicker">'+esc(r.tipologia_viaggio)+'</div><h2>'+esc(r.destinazione)+'</h2><p class="section-copy">'+esc(r.dettagli||"Nessuna preferenza aggiuntiva.")+'</p><div class="info-list"><div class="info-item"><span>Cliente</span><strong>'+esc(r.nome_cliente)+'</strong></div><div class="info-item"><span>Contatti</span><strong>'+esc(r.email)+' · '+esc(r.telefono)+'</strong></div><div class="info-item"><span>Periodo</span><strong>'+esc(r.periodo)+'</strong></div><div class="info-item"><span>Partecipanti</span><strong>'+r.adulti+' adulti · '+(r.bambini||0)+' bambini</strong></div><div class="info-item"><span>Budget</span><strong>'+esc(r.budget||"Non indicato")+'</strong></div></div><h3>Professionisti compatibili</h3>'+ranked.map(x=>'<div class="candidate"><div><strong>'+esc(x.p.nome)+'</strong><div class="meta">'+esc(x.reasons)+'</div></div><span class="candidate-score">'+x.n+' punti</span></div>').join("")+'<div id="assignMessage" class="notice" style="margin-top:18px">'+(current.length?"Già assegnata a "+current.length+" professionisti.":"Non ancora assegnata.")+'</div><button class="btn btn-primary" data-assign="'+r.$id+'" style="margin-top:14px">Abbina fino a 3 professionisti</button>';}
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){const r=requests.find(x=>x.$id===b.dataset.id);if(r)renderDetail(r);}});
document.getElementById("detail").addEventListener("click",async e=>{const b=e.target.closest("[data-assign]");if(!b)return;const r=requests.find(x=>x.$id===b.dataset.assign);const ranked=profiles.map(p=>({p,...score(p,r)})).sort((a,b)=>b.n-a.n).slice(0,3);if(!ranked.length)return alert("Nessun professionista collegato a un account.");b.disabled=true;try{const existing=assignments.filter(a=>a.richiesta_id===r.$id);for(const [index,item] of ranked.entries()){if(existing.some(a=>a.professionista_id===item.p.$id))continue;await api(base(APPWRITE_CONFIG.requestAssignmentsTableId),{method:"POST",body:{rowId:ID.unique(),data:{richiesta_id:r.$id,professionista_id:item.p.$id,utente_id:item.p.utente_id,ordine:index+1,motivo_match:item.reasons,stato:"inviata",letta:false},permissions:[Permission.read(Role.user(item.p.utente_id)),Permission.update(Role.user(item.p.utente_id)),Permission.read(Role.label("admin")),Permission.update(Role.label("admin")),Permission.delete(Role.label("admin"))]}});}const users=ranked.map(x=>x.p.utente_id);await api(base(APPWRITE_CONFIG.travelRequestsTableId)+"/"+r.$id,{method:"PATCH",body:{data:{stato:"assegnata",numero_assegnazioni:ranked.length},permissions:[Permission.read(Role.label("admin")),Permission.update(Role.label("admin")),...users.map(id=>Permission.read(Role.user(id)))]}});await load();}catch(error){alert(readableError(error));}finally{b.disabled=false;}});
document.getElementById("reload").onclick=load;document.getElementById("logout").onclick=async()=>{await account.deleteSession({sessionId:"current"});location="index.html";};
try{const user=await account.get();if(!(user.labels||[]).includes("admin"))throw new Error("Accesso amministrativo non autorizzato.");document.getElementById("access").hidden=true;document.getElementById("app").hidden=false;await load();}catch(error){const el=document.getElementById("access");el.classList.remove("loading");el.textContent=readableError(error);}
</script></body></html>
